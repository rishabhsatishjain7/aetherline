# Placeholder credentials for local/dev clusters only.
# In a real deployment this is replaced by a secret manager (AWS Secrets
# Manager + External Secrets Operator, or Sealed Secrets) -- never commit
# real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: aetherline-db-credentials
  namespace: aetherline
type: Opaque
stringData:
  POSTGRES_USER: aetherline
  POSTGRES_PASSWORD: aetherline
