# Placeholder credentials for local/dev clusters only.
# In a real deployment this is replaced by a secret manager (AWS Secrets
# Manager + External Secrets Operator, or Sealed Secrets) -- never commit
# real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: aetherline-db-credentials
  namespace: aetherline
type: Opaque
stringData:
  POSTGRES_USER: aetherline
  POSTGRES_PASSWORD: aetherline
---
# Placeholder gateway auth values for local/dev clusters only -- exactly
# like the db credentials above, intentionally NOT secrets and never to be
# reused anywhere real. The api-gateway reads both keys at boot and REFUSES
# TO START without them (fail closed). The AWS overlay overrides both env
# vars with CD-injected secrets (k8s/overlays/aws/gateway-auth.yaml), so the
# real deployment values never live in git.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-auth
  namespace: aetherline
type: Opaque
stringData:
  JWT_SECRET_KEY: local-dev-only-jwt-secret-not-real-change-me-0123456789
  API_GATEWAY_SHARED_SECRET: local-dev-only-not-a-real-secret
