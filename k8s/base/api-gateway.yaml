apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aetherline
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: aetherline/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8000}
          envFrom:
            - configMapRef: {name: aetherline-config}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aetherline
spec:
  type: LoadBalancer
  selector: {app: api-gateway}
  ports:
    - {port: 80, targetPort: 8000}
