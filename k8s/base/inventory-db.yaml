apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-db
  namespace: aetherline
spec:
  serviceName: inventory-db
  replicas: 1
  selector:
    matchLabels: {app: inventory-db}
  template:
    metadata:
      labels: {app: inventory-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: aetherline-db-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: aetherline-db-credentials, key: POSTGRES_PASSWORD}}
            - {name: POSTGRES_DB, value: "inventory"}
          ports:
            - {containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aetherline", "-d", "inventory"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-db
  namespace: aetherline
spec:
  clusterIP: None
  selector: {app: inventory-db}
  ports:
    - {port: 5432, targetPort: 5432}
