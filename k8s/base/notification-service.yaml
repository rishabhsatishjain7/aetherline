apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: aetherline
spec:
  replicas: 2
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service}
    spec:
      containers:
        - name: notification-service
          image: aetherline/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8000}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: aetherline-db-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: aetherline-db-credentials, key: POSTGRES_PASSWORD}}
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@notification-db:5432/notifications"
          envFrom:
            - configMapRef: {name: aetherline-config}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: aetherline
spec:
  selector: {app: notification-service}
  ports:
    - {port: 8000, targetPort: 8000}
