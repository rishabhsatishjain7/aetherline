# The CD workflow creates/refreshes the `ecr-pull` docker-registry secret
# (ECR tokens expire after 12 hours, so it is regenerated on every deploy).
#
# Attaching it to the namespace's `default` ServiceAccount means every pod in
# k8s/base picks it up without the imagePullSecrets stanza being repeated on
# all 9 Deployments — none of them set serviceAccountName, so they all use
# `default`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: aetherline
imagePullSecrets:
  - name: ecr-pull
