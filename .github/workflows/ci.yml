name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: services/${{ matrix.service }}
        run: |
          pip install ruff==0.6.9
          ruff check app

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest -v --timeout=30

  build-images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (build-only, not pushed on CI)
        run: docker build -t aetherline/${{ matrix.service }}:ci ./services/${{ matrix.service }}
